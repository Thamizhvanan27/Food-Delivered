<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <h4 class="fw-bold mb-4">Search Results for "<span class="text-danger" th:text="${query}">query</span>"</h4>

            <!-- Matching Restaurants Section -->
            <section class="mb-5">
                <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-shop me-2"></i>Matching Restaurants</h5>

                <div th:if="${matchingRestaurants.isEmpty()}" class="alert alert-light border shadow-sm">
                    No matching restaurants found.
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" th:unless="${matchingRestaurants.isEmpty()}">
                    <div class="col" th:each="rest : ${matchingRestaurants}">
                        <div class="card restaurant-card">
                            <div class="card-img-wrapper">
                                <img th:src="${rest.imageUrl}" th:alt="${rest.name}">
                            </div>
                            <div class="card-body p-3">
                                <h6 class="fw-bold mb-1" th:text="${rest.name}">Name</h6>
                                <p class="text-muted small mb-2" th:text="${rest.cuisine}">Cuisine</p>
                                <a th:href="@{/restaurants/{id}(id=${rest.id})}" class="btn btn-outline-food btn-sm w-100">View Restaurant</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Matching Food Items Section -->
            <section>
                <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-egg-fried me-2"></i>Matching Dishes</h5>

                <div th:if="${matchingFood.isEmpty()}" class="alert alert-light border shadow-sm">
                    No matching food dishes found.
                </div>

                <div class="row row-cols-1 row-cols-md-2 g-3" th:unless="${matchingFood.isEmpty()}">
                    <div class="col" th:each="item : ${matchingFood}">
                        <div class="card border-0 shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="fw-bold mb-1" th:text="${item.name}">Dish Name</h6>
                                    <p class="text-muted small mb-1" th:text="${item.restaurant.name}">Restaurant</p>
                                    <p class="fw-bold text-danger mb-0">₹<span th:text="${item.price}">190.00</span></p>
                                </div>
                                <div>
                                    <a th:href="@{/restaurants/{id}(id=${item.restaurant.id})}" class="btn btn-primary-food btn-sm">Order Item</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
