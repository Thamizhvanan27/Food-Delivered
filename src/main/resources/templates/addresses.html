<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Addresses - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0"><i class="bi bi-geo-alt text-danger me-2"></i>Saved Delivery Addresses</h3>
                <button type="button" class="btn btn-primary-food" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                    <i class="bi bi-plus-lg me-1"></i>Add New Address
                </button>
            </div>

            <!-- Address Cards Grid -->
            <div th:if="${addresses.isEmpty()}" class="text-center py-5 bg-white rounded-4 shadow-sm">
                <i class="bi bi-geo-alt-fill display-1 text-muted"></i>
                <h4 class="fw-bold text-dark mt-3">No Saved Addresses</h4>
                <p class="text-muted">Add a delivery address to place orders faster.</p>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${addresses.isEmpty()}">
                <div class="col" th:each="addr : ${addresses}">
                    <div class="card h-100 border-0 shadow-sm rounded-4 p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0 text-dark" th:text="${addr.fullName}">Full Name</h5>
                            <span th:if="${addr.isDefault}" class="badge bg-success">Default</span>
                        </div>
                        <p class="text-secondary small mb-1" th:text="${addr.houseNo + ', ' + addr.addressLine}">House, Street</p>
                        <p class="text-secondary small mb-1" th:text="${addr.city + ', ' + addr.state + ' - ' + addr.pincode}">City, Pincode</p>
                        <p class="text-secondary small mb-3"><i class="bi bi-telephone me-1"></i><span th:text="${addr.phone}">Phone</span></p>

                        <div class="mt-auto border-top pt-3 text-end">
                            <form th:action="@{/addresses/delete/{id}(id=${addr.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this address?')">
                                    <i class="bi bi-trash me-1"></i>Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Address Modal -->
        <div class="modal fade" id="addAddressModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4">
                    <div class="modal-header">
                        <h5 class="modal-header-title fw-bold">Add Delivery Address</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/addresses/save}" method="post" th:object="${addressDto}">
                        <div class="modal-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Full Name *</label>
                                    <input type="text" th:field="*{fullName}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Phone Number *</label>
                                    <input type="text" th:field="*{phone}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Flat / House No. *</label>
                                    <input type="text" th:field="*{houseNo}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Street / Area *</label>
                                    <input type="text" th:field="*{addressLine}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">City *</label>
                                    <input type="text" th:field="*{city}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">State *</label>
                                    <input type="text" th:field="*{state}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Pincode *</label>
                                    <input type="text" th:field="*{pincode}" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Landmark (Optional)</label>
                                    <input type="text" th:field="*{landmark}" class="form-control">
                                </div>
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{default}" id="isDefaultCheck">
                                        <label class="form-check-label small" for="isDefaultCheck">Set as default delivery address</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary-food">Save Address</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
