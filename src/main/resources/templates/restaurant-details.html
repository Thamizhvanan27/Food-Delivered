<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${restaurant.name + ' Menu - FoodExpress'}">Restaurant Details - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Restaurant Info Banner Header -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img th:src="${restaurant.imageUrl}" th:alt="${restaurant.name}" class="img-fluid h-100 w-100 object-fit-cover">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h2 class="fw-bold mb-1" th:text="${restaurant.name}">Spice Garden</h2>
                                    <p class="text-muted mb-2" th:text="${restaurant.cuisine}">North Indian, Biryani</p>
                                    <p class="text-secondary small mb-3"><i class="bi bi-geo-alt me-1"></i><span th:text="${restaurant.address + ', ' + restaurant.city}">Address</span></p>
                                </div>
                                <span class="rating-badge fs-6 px-3 py-2"><i class="bi bi-star-fill me-1"></i> <span th:text="${restaurant.rating}">4.7</span></span>
                            </div>

                            <div class="d-flex gap-4 border-top pt-3 text-muted small">
                                <div><i class="bi bi-clock me-1 text-primary"></i> <strong>Delivery Time:</strong> <span th:text="${restaurant.deliveryTimeMinutes}">25</span> mins</div>
                                <div><i class="bi bi-wallet2 me-1 text-primary"></i> <strong>Cost:</strong> <span th:text="${restaurant.priceRange}">₹350 for two</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Menu Categories & Items -->
            <h4 class="fw-bold mb-3"><i class="bi bi-book me-2"></i>Menu Items</h4>

            <div th:if="${itemsByCategory.isEmpty()}" class="text-center py-5 bg-white rounded-3 shadow-sm">
                <i class="bi bi-egg-fried display-1 text-muted"></i>
                <h5 class="mt-3">No Food Items Available</h5>
                <p class="text-muted">This restaurant currently has no active items on the menu.</p>
            </div>

            <div th:each="entry : ${itemsByCategory}" class="mb-4">
                <h5 class="fw-bold border-bottom pb-2 text-danger" th:text="${entry.key}">Category Name</h5>

                <div class="row row-cols-1 row-cols-md-2 g-3 mt-1">
                    <div class="col" th:each="item : ${entry.value}">
                        <div class="card h-100 border-0 shadow-sm rounded-3 p-3">
                            <div class="row align-items-center g-3">
                                <div class="col-8">
                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <span th:if="${item.isVegetarian}" class="veg-icon" title="Vegetarian"></span>
                                        <span th:unless="${item.isVegetarian}" class="non-veg-icon" title="Non-Vegetarian"></span>
                                        <h6 class="fw-bold mb-0" th:text="${item.name}">Food Item Name</h6>
                                    </div>
                                    <p class="fw-bold text-dark mb-1">₹<span th:text="${item.price}">250.00</span></p>
                                    <p class="text-muted small mb-0" th:text="${item.description}">Item Description</p>
                                </div>
                                <div class="col-4 text-center">
                                    <div class="position-relative">
                                        <img th:src="${item.imageUrl}" th:alt="${item.name}" class="img-fluid rounded-3 mb-2" style="height: 90px; width: 100%; object-fit: cover;">
                                        
                                        <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post">
                                            <input type="hidden" name="foodItemId" th:value="${item.id}">
                                            <input type="hidden" name="quantity" value="1">
                                            <button type="submit" class="btn btn-primary-food btn-sm w-100">
                                                <i class="bi bi-plus-lg me-1"></i>ADD
                                            </button>
                                        </form>

                                        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-food btn-sm w-100">
                                            <i class="bi bi-plus-lg me-1"></i>ADD
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
