<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <h3 class="fw-bold mb-4"><i class="bi bi-receipt text-danger me-2"></i>My Orders</h3>

            <div th:if="${orders.isEmpty()}" class="text-center py-5 bg-white rounded-4 shadow-sm">
                <i class="bi bi-journal-x display-1 text-muted"></i>
                <h4 class="fw-bold text-dark mt-3">No Past Orders Found</h4>
                <p class="text-muted mb-4">Looks like you haven't placed any food orders yet.</p>
                <a th:href="@{/restaurants}" class="btn btn-primary-food px-4 py-2">Explore Restaurants</a>
            </div>

            <div class="row row-cols-1 g-4" th:unless="${orders.isEmpty()}">
                <div class="col" th:each="order : ${orders}">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <div class="d-md-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                            <div class="d-flex align-items-center gap-3 mb-2 mb-md-0">
                                <img th:src="${order.restaurant.imageUrl}" th:alt="${order.restaurant.name}" class="rounded-3" style="width: 60px; height: 60px; object-fit: cover;">
                                <div>
                                    <h5 class="fw-bold mb-0 text-dark" th:text="${order.restaurant.name}">Restaurant Name</h5>
                                    <p class="text-muted small mb-0">Order #<span th:text="${order.orderNumber}">ORD-1234</span> • <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span></p>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span th:if="${order.orderStatus.name() == 'PLACED'}" class="badge bg-primary px-3 py-2">PLACED</span>
                                <span th:if="${order.orderStatus.name() == 'CONFIRMED'}" class="badge bg-info text-dark px-3 py-2">CONFIRMED</span>
                                <span th:if="${order.orderStatus.name() == 'PREPARING'}" class="badge bg-warning text-dark px-3 py-2">PREPARING</span>
                                <span th:if="${order.orderStatus.name() == 'OUT_FOR_DELIVERY'}" class="badge bg-secondary px-3 py-2">OUT FOR DELIVERY</span>
                                <span th:if="${order.orderStatus.name() == 'DELIVERED'}" class="badge bg-success px-3 py-2">DELIVERED</span>
                                <span th:if="${order.orderStatus.name() == 'CANCELLED'}" class="badge bg-danger px-3 py-2">CANCELLED</span>

                                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-food btn-sm">View Details</a>
                            </div>
                        </div>

                        <!-- Items preview list -->
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="text-secondary small">
                                <span th:each="item, iter : ${order.items}">
                                    <span th:text="${item.quantity + 'x ' + item.foodName}">1x Dish</span><span th:unless="${iter.last}">, </span>
                                </span>
                            </div>
                            <div class="fw-bold fs-5 text-dark">
                                ₹<span th:text="${order.grandTotal}">500.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
