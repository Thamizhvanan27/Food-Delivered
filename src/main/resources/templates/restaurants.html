<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row g-4">
                <!-- Sidebar Filters -->
                <div class="col-lg-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3">
                        <h5 class="fw-bold mb-3"><i class="bi bi-funnel me-2"></i>Filters</h5>
                        
                        <form th:action="@{/restaurants}" method="get">
                            <!-- Keyword Search -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Search</label>
                                <input type="text" name="query" class="form-control" th:value="${filter.query}" placeholder="Restaurant or cuisine...">
                            </div>

                            <!-- Cuisine Filter -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Cuisine</label>
                                <select name="cuisine" class="form-select">
                                    <option value="ALL">All Cuisines</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}" th:selected="${filter.cuisine == cat.name}"></option>
                                </select>
                            </div>

                            <!-- Minimum Rating -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Min Rating</label>
                                <select name="minRating" class="form-select">
                                    <option value="">Any Rating</option>
                                    <option value="4.5" th:selected="${filter.minRating == 4.5}">4.5+ Rating</option>
                                    <option value="4.0" th:selected="${filter.minRating == 4.0}">4.0+ Rating</option>
                                    <option value="3.5" th:selected="${filter.minRating == 3.5}">3.5+ Rating</option>
                                </select>
                            </div>

                            <!-- Sort By -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Sort By</label>
                                <select name="sortBy" class="form-select">
                                    <option value="rating" th:selected="${filter.sortBy == 'rating'}">Highest Rating</option>
                                    <option value="deliveryTime" th:selected="${filter.sortBy == 'deliveryTime'}">Fastest Delivery</option>
                                    <option value="name" th:selected="${filter.sortBy == 'name'}">Name (A-Z)</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary-food w-100">Apply Filters</button>
                            <a th:href="@{/restaurants}" class="btn btn-link text-muted btn-sm w-100 mt-2 text-decoration-none">Clear Filters</a>
                        </form>
                    </div>
                </div>

                <!-- Restaurant Listing Grid -->
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Available Restaurants (<span th:text="${restaurants.size()}">0</span>)</h4>
                    </div>

                    <div th:if="${restaurants.isEmpty()}" class="text-center py-5 bg-white rounded-3 shadow-sm">
                        <i class="bi bi-shop-window display-1 text-muted"></i>
                        <h4 class="mt-3">No Restaurants Found</h4>
                        <p class="text-muted">Try adjusting your filter options or search term.</p>
                        <a th:href="@{/restaurants}" class="btn btn-outline-food">Reset Filters</a>
                    </div>

                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" th:unless="${restaurants.isEmpty()}">
                        <div class="col" th:each="rest : ${restaurants}">
                            <div class="card restaurant-card">
                                <div class="card-img-wrapper">
                                    <img th:src="${rest.imageUrl}" th:alt="${rest.name}">
                                </div>
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title fw-bold mb-0 text-truncate" th:text="${rest.name}">Restaurant</h5>
                                        <span class="rating-badge"><i class="bi bi-star-fill"></i> <span th:text="${rest.rating}">4.5</span></span>
                                    </div>
                                    <p class="card-text text-muted small mb-2 text-truncate" th:text="${rest.cuisine}">Cuisine</p>
                                    <p class="text-secondary small mb-2"><i class="bi bi-geo-alt me-1"></i><span th:text="${rest.address}">Address</span></p>
                                    <div class="d-flex justify-content-between align-items-center text-muted small border-top pt-2">
                                        <span><i class="bi bi-clock me-1"></i><span th:text="${rest.deliveryTimeMinutes}">30</span> mins</span>
                                        <span th:text="${rest.priceRange}">₹300 for two</span>
                                    </div>
                                </div>
                                <div class="card-footer bg-white border-0 p-3 pt-0">
                                    <a th:href="@{/restaurants/{id}(id=${rest.id})}" class="btn btn-primary-food w-100">View Menu</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
