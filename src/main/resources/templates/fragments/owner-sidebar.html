<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside th:fragment="owner-sidebar(activeTab)" class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse shadow-sm p-3 min-vh-100 position-sticky top-0">
    <div class="d-flex align-items-center mb-4 text-white text-decoration-none px-2 pt-2">
        <i class="bi bi-shop-window text-purple fs-2 me-2"></i>
        <div>
            <span class="fs-5 fw-bold d-block text-gradient">Partner Portal</span>
            <small class="text-white-50 fs-xs">FoodExpress Partner</small>
        </div>
    </div>
    <hr class="border-secondary opacity-50 my-3">
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a th:href="@{/owner/dashboard}" th:classappend="${activeTab == 'dashboard'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/owner/restaurants}" th:classappend="${activeTab == 'restaurants'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-building"></i> My Restaurants
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/owner/restaurants/new}" th:classappend="${activeTab == 'register-restaurant'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-plus-circle-fill"></i> Register Restaurant
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/owner/menu}" th:classappend="${activeTab == 'menu'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-journals"></i> Menu Management
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/owner/orders}" th:classappend="${activeTab == 'orders'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-bag-check-fill"></i> Orders
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/owner/profile}" th:classappend="${activeTab == 'profile'} ? 'active bg-purple' : 'text-white-50'" class="nav-link text-white d-flex align-items-center gap-2 py-2.5 px-3 rounded-3">
                <i class="bi bi-person-gear"></i> Owner Profile
            </a>
        </li>
    </ul>

    <hr class="border-secondary opacity-50 my-4">

    <div class="mt-auto">
        <a th:href="@{/}" class="btn btn-outline-light btn-sm w-100 mb-2 rounded-pill d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-eye-fill"></i> View Marketplace
        </a>
        <a th:href="@{/logout}" class="btn btn-danger btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</aside>

</body>
</html>
