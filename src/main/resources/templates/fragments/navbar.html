<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Header Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-name" th:href="@{/}">
                <i class="bi bi-bag-heart-fill me-1 text-danger"></i>Food<span>Express</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#foodNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="foodNavbar">
                <!-- Search bar in header -->
                <form class="d-flex mx-auto col-lg-5 my-2 my-lg-0" th:action="@{/search}" method="get">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                        <input class="form-control bg-light border-0 ps-0" type="search" name="q" placeholder="Search for restaurants, dishes or cuisines..." aria-label="Search">
                        <button class="btn btn-primary-food" type="submit">Search</button>
                    </div>
                </form>

                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/restaurants}"><i class="bi bi-shop me-1"></i>Restaurants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/offers}"><i class="bi bi-percent me-1"></i>Offers</a>
                    </li>

                    <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/orders}"><i class="bi bi-receipt me-1"></i>My Orders</a>
                    </li>

                    <!-- Cart Link -->
                    <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                        <a class="nav-link position-relative" th:href="@{/cart}">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span class="cart-badge" th:text="${cartItemCount != null ? cartItemCount : 0}">0</span>
                        </a>
                    </li>

                    <li class="nav-item me-2" sec:authorize="isAnonymous()">
                        <a class="btn btn-outline-purple btn-sm rounded-pill px-3" th:href="@{/owner/register}">
                            <i class="bi bi-shop me-1"></i>Partner Portal
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="btn btn-outline-food me-2" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="btn btn-primary-food" th:href="@{/register}">Sign Up</a>
                    </li>

                    <!-- Logged in dropdown -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 text-primary"></i>
                            <span sec:authentication="name" class="fw-semibold">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                            <li><a class="dropdown-item" th:href="@{/addresses}"><i class="bi bi-geo-alt me-2"></i>Saved Addresses</a></li>
                            <li><a class="dropdown-item" th:href="@{/orders}"><i class="bi bi-bag-check me-2"></i>Order History</a></li>
                            
                            <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')"><hr class="dropdown-divider"></li>
                            <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')">
                                <a class="dropdown-item text-purple fw-bold" th:href="@{/owner/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Partner Dashboard</a>
                            </li>

                            <li sec:authorize="hasAuthority('ROLE_ADMIN')"><hr class="dropdown-divider"></li>
                            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                                <a class="dropdown-item text-danger fw-bold" th:href="@{/admin/dashboard}"><i class="bi bi-shield-lock me-2"></i>Admin Dashboard</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
