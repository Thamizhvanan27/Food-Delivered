<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <h3 class="fw-bold mb-4"><i class="bi bi-person-circle text-danger me-2"></i>My Profile</h3>

            <div class="row g-4">
                <!-- User Account Overview -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
                        <div class="mb-3">
                            <i class="bi bi-person-circle display-1 text-primary"></i>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${currentUser.name}">User Name</h4>
                        <p class="text-muted mb-2" th:text="${currentUser.email}">user@example.com</p>
                        <span class="badge bg-danger rounded-pill px-3 py-2 w-fit mx-auto" th:text="${currentUser.role}">ROLE_CUSTOMER</span>

                        <hr class="my-3">

                        <div class="d-flex justify-content-around text-center">
                            <div>
                                <h5 class="fw-bold mb-0 text-danger" th:text="${orders.size()}">0</h5>
                                <small class="text-muted">Total Orders</small>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-0 text-danger" th:text="${addresses.size()}">0</h5>
                                <small class="text-muted">Saved Addresses</small>
                            </div>
                        </div>

                        <div class="mt-4">
                            <a th:href="@{/addresses}" class="btn btn-outline-food w-100 mb-2"><i class="bi bi-geo-alt me-1"></i>Manage Addresses</a>
                            <a th:href="@{/orders}" class="btn btn-primary-food w-100"><i class="bi bi-receipt me-1"></i>View Orders</a>
                        </div>
                    </div>
                </div>

                <!-- Update Info & Password Form -->
                <div class="col-lg-8">
                    <!-- Update Profile Details -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-3">Edit Personal Details</h5>
                        
                        <form th:action="@{/profile/update}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <input type="text" name="name" class="form-control" th:value="${currentUser.name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address (Read-only)</label>
                                    <input type="email" class="form-control" th:value="${currentUser.email}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <input type="text" name="phone" class="form-control" th:value="${currentUser.phone}" required>
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn btn-primary-food">Save Changes</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Change Password -->
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Change Password</h5>

                        <form th:action="@{/profile/password}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <input type="password" name="oldPassword" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" minlength="6" required>
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn btn-outline-danger">Update Password</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
