<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Registered Users | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <h3 class="fw-bold mb-4">Registered Platform Users</h3>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="table-responsive p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr class="text-muted small">
                                <th>User ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Joined Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="fw-bold" th:text="${'#' + u.id}">#1</td>
                                <td class="fw-bold text-dark" th:text="${u.name}">User Name</td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td th:text="${u.phone}">Phone</td>
                                <td>
                                    <span th:if="${u.role == 'ROLE_ADMIN'}" class="badge bg-danger">ADMIN</span>
                                    <span th:if="${u.role == 'ROLE_RESTAURANT_OWNER'}" class="badge bg-purple">RESTAURANT OWNER</span>
                                    <span th:if="${u.role == 'ROLE_CUSTOMER'}" class="badge bg-primary">CUSTOMER</span>
                                </td>
                                <td class="small text-muted" th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd MMM yyyy') : '-'}">Date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
