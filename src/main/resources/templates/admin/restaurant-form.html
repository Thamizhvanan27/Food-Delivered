<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Form - Admin | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <h3 class="fw-bold mb-4" th:text="${restaurant.id != null ? 'Edit Restaurant' : 'Create New Restaurant'}">Restaurant Form</h3>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <form th:action="@{/admin/restaurants/save}" method="post" th:object="${restaurant}">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Restaurant Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Cuisine Type *</label>
                            <input type="text" th:field="*{cuisine}" class="form-control" placeholder="e.g. North Indian, Biryani" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Street Address *</label>
                            <input type="text" th:field="*{address}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City *</label>
                            <input type="text" th:field="*{city}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Rating (1.0 - 5.0)</label>
                            <input type="number" step="0.1" th:field="*{rating}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Delivery Time (mins)</label>
                            <input type="number" th:field="*{deliveryTimeMinutes}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Price Range</label>
                            <input type="text" th:field="*{priceRange}" class="form-control" placeholder="e.g. ₹300 for two">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Image URL</label>
                            <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                                <label class="form-check-label" for="activeCheck">Active on Platform</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary-food">Save Restaurant</button>
                            <a th:href="@{/admin/restaurants}" class="btn btn-light ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
