<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Categories | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <h3 class="fw-bold mb-4">Manage Food Categories</h3>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row g-4">
                <!-- Add New Category Form -->
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Add Category</h5>
                        <form th:action="@{/admin/categories/save}" method="post" th:object="${newCategory}">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Category Name *</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Desserts" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Description</label>
                                <input type="text" th:field="*{description}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Image URL</label>
                                <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/...">
                            </div>
                            <button type="submit" class="btn btn-primary-food w-100">Save Category</button>
                        </form>
                    </div>
                </div>

                <!-- Existing Categories Grid -->
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="table-responsive p-3">
                            <table class="table align-middle">
                                <thead>
                                    <tr class="text-muted small">
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td>
                                            <img th:src="${cat.imageUrl}" th:alt="${cat.name}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                                        </td>
                                        <td class="fw-bold" th:text="${cat.name}">Category</td>
                                        <td class="small text-muted" th:text="${cat.description}">Description</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
