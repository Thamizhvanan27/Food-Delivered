<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Orders | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Manage Orders</h3>

                <!-- Filter by status -->
                <form th:action="@{/admin/orders}" method="get" class="d-flex align-items-center gap-2">
                    <label class="small text-muted fw-semibold">Status:</label>
                    <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="ALL">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st.name()}" th:text="${st.name()}" th:selected="${currentStatusFilter == st.name()}"></option>
                    </select>
                </form>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="table-responsive p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr class="text-muted small">
                                <th>Order Number</th>
                                <th>Date & Time</th>
                                <th>Customer</th>
                                <th>Restaurant</th>
                                <th>Total Amount</th>
                                <th>Payment Method</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${orders}">
                                <td class="fw-bold" th:text="${o.orderNumber}">ORD-123</td>
                                <td class="small" th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                                <td class="small" th:text="${o.user.name}">Customer</td>
                                <td class="small" th:text="${o.restaurant.name}">Restaurant</td>
                                <td class="fw-bold">₹<span th:text="${o.grandTotal}">500.00</span></td>
                                <td class="small"><span class="badge bg-light text-dark border" th:text="${o.paymentMethod}">COD</span></td>
                                <td>
                                    <span th:if="${o.orderStatus.name() == 'PLACED'}" class="badge bg-primary">PLACED</span>
                                    <span th:if="${o.orderStatus.name() == 'CONFIRMED'}" class="badge bg-info text-dark">CONFIRMED</span>
                                    <span th:if="${o.orderStatus.name() == 'PREPARING'}" class="badge bg-warning text-dark">PREPARING</span>
                                    <span th:if="${o.orderStatus.name() == 'OUT_FOR_DELIVERY'}" class="badge bg-secondary">OUT FOR DELIVERY</span>
                                    <span th:if="${o.orderStatus.name() == 'DELIVERED'}" class="badge bg-success">DELIVERED</span>
                                    <span th:if="${o.orderStatus.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square me-1"></i>Update Status</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
