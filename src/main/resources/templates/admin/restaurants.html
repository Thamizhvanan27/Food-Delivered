<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Restaurants | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Manage Restaurants</h3>
                <a th:href="@{/admin/restaurants/new}" class="btn btn-primary-food"><i class="bi bi-plus-lg me-1"></i>Add Restaurant</a>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="table-responsive p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr class="text-muted small">
                                <th>Image</th>
                                <th>Name</th>
                                <th>Owner</th>
                                <th>Cuisine</th>
                                <th>City</th>
                                <th>Rating</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${restaurants}">
                                <td>
                                    <img th:src="${r.imageUrl}" th:alt="${r.name}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;">
                                </td>
                                <td class="fw-bold" th:text="${r.name}">Name</td>
                                <td class="small fw-semibold text-purple" th:text="${r.owner != null ? r.owner.name : 'System Admin'}">Owner</td>
                                <td class="small" th:text="${r.cuisine}">Cuisine</td>
                                <td class="small" th:text="${r.city}">City</td>
                                <td><span class="rating-badge"><i class="bi bi-star-fill"></i> <span th:text="${r.rating}">4.5</span></span></td>
                                <td>
                                    <form th:action="@{/admin/restaurants/toggle/{id}(id=${r.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm" th:classappend="${r.active ? 'btn-success' : 'btn-secondary'}" th:text="${r.active ? 'Active' : 'Inactive'}">Active</button>
                                    </form>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/restaurants/edit/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i> Edit</a>
                                    <form th:action="@{/admin/restaurants/delete/{id}(id=${r.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete restaurant?')"><i class="bi bi-trash"></i> Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
