<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Food Items | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="admin-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Manage Food Items</h3>
                <a th:href="@{/admin/food/new}" class="btn btn-primary-food"><i class="bi bi-plus-lg me-1"></i>Add Food Item</a>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="table-responsive p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr class="text-muted small">
                                <th>Image</th>
                                <th>Name</th>
                                <th>Restaurant</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Veg/Non-Veg</th>
                                <th>Available</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${foodItems}">
                                <td>
                                    <img th:src="${f.imageUrl}" th:alt="${f.name}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;">
                                </td>
                                <td class="fw-bold" th:text="${f.name}">Dish</td>
                                <td class="small" th:text="${f.restaurant.name}">Restaurant</td>
                                <td class="small" th:text="${f.category != null ? f.category.name : '-'}">Category</td>
                                <td class="fw-bold">₹<span th:text="${f.price}">0.00</span></td>
                                <td>
                                    <span th:if="${f.isVegetarian}" class="badge bg-success">VEG</span>
                                    <span th:unless="${f.isVegetarian}" class="badge bg-danger">NON-VEG</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/food/toggle/{id}(id=${f.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm" th:classappend="${f.available ? 'btn-success' : 'btn-secondary'}" th:text="${f.available ? 'Available' : 'Unavailable'}">Status</button>
                                    </form>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/food/edit/{id}(id=${f.id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i> Edit</a>
                                    <form th:action="@{/admin/food/delete/{id}(id=${f.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete food item?')"><i class="bi bi-trash"></i> Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
