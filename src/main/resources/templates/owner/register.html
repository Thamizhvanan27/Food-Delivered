<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Partner Registration | FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none fs-2 fw-bold text-gradient">
                    <i class="bi bi-shop-window text-purple"></i> FoodExpress Partner Portal
                </a>
                <p class="text-muted mt-2">Grow your restaurant business with seamless online ordering</p>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-purple text-white p-4 text-center">
                    <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill me-2"></i>Register as Restaurant Partner</h4>
                    <p class="mb-0 text-white-50 fs-sm">Create your restaurant owner account to get started</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Error message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/owner/register}" th:object="${ownerRegisterDto}" method="post">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Owner or Manager Name" required>
                            </div>
                            <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Business Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="owner@restaurant.com" required>
                            </div>
                            <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+91 9876543210" required>
                            </div>
                            <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                            </div>
                            <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat your password" required>
                            </div>
                            <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-purple btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm">
                            <i class="bi bi-check-circle-fill me-2"></i>Create Partner Account
                        </button>

                    </form>

                    <div class="mt-4 text-center">
                        <span class="text-muted">Already a partner?</span>
                        <a th:href="@{/login}" class="text-purple fw-semibold ms-1 text-decoration-none">Log in to Partner Portal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
