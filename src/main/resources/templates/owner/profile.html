<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Profile | Partner Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/owner-sidebar :: owner-sidebar('profile')}"></div>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h2 class="h3 fw-bold mb-0">Owner Profile Settings 👤</h2>
                    <p class="text-muted mb-0 fs-sm">Update your account information, phone number, and security password.</p>
                </div>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Profile Edit Form -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <h5 class="fw-bold mb-0"><i class="bi bi-person-lines-fill me-2 text-purple"></i>Account Details</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/owner/profile/update}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <input type="text" name="name" th:value="${owner.name}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email Address (Read-Only)</label>
                                    <input type="email" th:value="${owner.email}" class="form-control bg-light" readonly>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <input type="tel" name="phone" th:value="${owner.phone}" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-purple rounded-pill px-4 fw-bold">Update Account Info</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Password Change Form -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <h5 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2 text-purple"></i>Change Security Password</h5>
                        </div>
                        <div class="card-body p-4">
                            <div th:if="${passwordSuccess}" class="alert alert-success rounded-3 mb-3" th:text="${passwordSuccess}"></div>
                            <div th:if="${passwordError}" class="alert alert-danger rounded-3 mb-3" th:text="${passwordError}"></div>

                            <form th:action="@{/owner/profile/password}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <input type="password" name="oldPassword" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Confirm New Password</label>
                                    <input type="password" name="confirmPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-outline-purple rounded-pill px-4 fw-bold">Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
