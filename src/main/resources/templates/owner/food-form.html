<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Food Item | Partner Portal' : 'Add Food Item | Partner Portal'">Add Food Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/owner-sidebar :: owner-sidebar('menu')}"></div>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h2 class="h3 fw-bold mb-0" th:text="${isEdit} ? 'Edit Menu Item' : 'Add New Menu Item'">Add Food Item</h2>
                    <p class="text-muted mb-0 fs-sm">Configure food name, price, dietary preferences, and preparation time.</p>
                </div>
                <a th:href="@{/owner/menu}" class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i> Back to Menu
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/owner/menu/save}" th:object="${foodDto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Select Restaurant <span class="text-danger">*</span></label>
                                <select th:field="*{restaurantId}" class="form-select" required>
                                    <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.name}">Restaurant</option>
                                </select>
                                <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('restaurantId')}" th:errors="*{restaurantId}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Food Category</label>
                                <select th:field="*{categoryId}" class="form-select">
                                    <option value="">-- Select Category --</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Food Item Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Paneer Butter Masala" required>
                                <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Price (₹) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="250.00" required>
                                <div class="text-danger fs-xs mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Describe ingredients, taste profile, portion size..."></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Food Image URL</label>
                                <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Prep Time (Mins)</label>
                                <input type="number" th:field="*{prepTimeMinutes}" class="form-control" placeholder="20">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-check form-switch pt-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{vegetarian}" id="vegSwitch">
                                    <label class="form-check-label fw-semibold" for="vegSwitch">Vegetarian Dish</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch pt-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{available}" id="availableSwitch">
                                    <label class="form-check-label fw-semibold" for="availableSwitch">Available for Ordering</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4">
                            <a th:href="@{/owner/menu}" class="btn btn-light border px-4 rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-purple px-5 rounded-pill fw-bold shadow-sm">
                                <i class="bi bi-check-lg me-1"></i> Save Menu Item
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
