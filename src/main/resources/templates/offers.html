<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers & Coupons - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div class="text-center mb-5">
                <span class="badge bg-danger mb-2 px-3 py-2 fs-6 rounded-pill">🔥 EXCLUSIVE DEALS</span>
                <h2 class="fw-bold">Best Food Deals & Coupons</h2>
                <p class="text-muted">Apply promotional coupon codes during checkout to save big on your favorite food!</p>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="coupon : ${coupons}">
                    <div class="card h-100 border-0 shadow-sm rounded-4 p-4 position-relative overflow-hidden">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="fs-1 text-danger"><i class="bi bi-ticket-perforated-fill"></i></div>
                            <div>
                                <h4 class="fw-bold text-dark mb-0" th:text="${coupon.code}">WELCOME50</h4>
                                <small class="text-success fw-bold">ACTIVE PROMO</small>
                            </div>
                        </div>

                        <p class="text-secondary mb-3" th:text="${coupon.description}">Get 50% OFF up to ₹100 on your first order.</p>

                        <div class="bg-light p-3 rounded-3 mb-3 small text-muted">
                            <div class="d-flex justify-content-between mb-1">
                                <span>Min Order Amount:</span>
                                <strong class="text-dark">₹<span th:text="${coupon.minOrderAmount}">199.00</span></strong>
                            </div>
                            <div class="d-flex justify-content-between mb-1" th:if="${coupon.maxDiscountAmount != null}">
                                <span>Max Discount:</span>
                                <strong class="text-dark">₹<span th:text="${coupon.maxDiscountAmount}">100.00</span></strong>
                            </div>
                            <div class="d-flex justify-content-between" th:if="${coupon.expiryDate != null}">
                                <span>Expires On:</span>
                                <strong class="text-dark" th:text="${#temporals.format(coupon.expiryDate, 'dd MMM yyyy')}">Date</strong>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <button type="button" class="btn btn-outline-food w-100 btn-copy-coupon" th:data-code="${coupon.code}">
                                <i class="bi bi-clipboard me-1"></i>Copy Promo Code
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
