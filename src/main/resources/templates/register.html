<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="text-center mb-4">
                    <a class="brand-name fs-2 text-decoration-none" th:href="@{/}">
                        <i class="bi bi-bag-heart-fill me-1 text-danger"></i>Food<span class="text-danger">Express</span>
                    </a>
                    <p class="text-muted">Create a free account to order food in seconds.</p>
                </div>

                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <form th:action="@{/register}" method="post" th:object="${registerDto}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="+91 9876543210" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary-food w-100 py-2 fs-6 mb-3">Create Free Account</button>
                    </form>

                    <div class="text-center text-muted small">
                        Already have an account? <a th:href="@{/login}" class="text-danger fw-bold text-decoration-none">Login Here</a>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
