# FoodExpress Application Configuration
spring.application.name=food-delivery
server.port=8080

# -------------------------------------------------------------
# MYSQL DATABASE CONFIGURATION
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -------------------------------------------------------------
# THYMELEAF CONFIGURATION
# -------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------
# LOGGING & UPLOAD CONFIGURATION
# -------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.example.food.delivery=INFO
