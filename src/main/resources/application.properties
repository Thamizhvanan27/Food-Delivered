# FoodExpress Application Configuration
spring.application.name=food-delivery
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
server.port=${PORT:8080}

# -------------------------------------------------------------
# MYSQL DATABASE CONFIGURATION (Railway & Local Compatible)
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:food_delivery}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -------------------------------------------------------------
# THYMELEAF CONFIGURATION
# -------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------
# LOGGING & UPLOAD CONFIGURATION
# -------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.example.food.delivery=INFO

